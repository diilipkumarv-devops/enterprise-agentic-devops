global:
  scrape_interval: 15s # How frequently to pull metrics from targets
  evaluation_interval: 15s

scrape_configs:
  # 1. Scrape metrics from Prometheus itself
  - job_name: 'prometheus_internal'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Scrape performance metrics from the running Agent Network Engine
  - job_name: 'agentic_platform_metrics'
    static_configs:
      - targets: ['n8n-orchestrator:5678']
