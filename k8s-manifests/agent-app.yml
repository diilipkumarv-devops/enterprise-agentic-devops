apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-agentic-devops
  namespace: default
  labels:
    app: enterprise-agentic-devops

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: enterprise-agentic-devops

  template:
    metadata:
      labels:
        app: enterprise-agentic-devops

    spec:
      containers:
        - name: agentic-api
          image: enterprise-agentic-devops:1.6
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: OLLAMA_BASE_URL
              value: "http://host.docker.internal:11434"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-agentic-devops
  namespace: default
  labels:
    app: enterprise-agentic-devops

spec:
  type: ClusterIP

  selector:
    app: enterprise-agentic-devops

  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
